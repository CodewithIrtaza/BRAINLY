[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainly-api"
version = "1.0.0"
description = "Brainly AI Customer Support Agent Platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pydantic-extra-types==2.7.0",
    "sqlalchemy==2.1.9",
    "asyncpg==0.29.0",
    "alembic==1.12.1",
    "pgvector==0.2.5",
    "supabase==2.8.0",
    "gotrue==2.8.0",
    "httpx==0.27.0",
    "openai==1.30.1",
    "pymupdf==1.23.7",
    "pdfplumber==0.11.4",
    "python-magic==0.4.27",
    "tiktoken==0.7.0",
    "langdetect==1.0.9",
    "resend==0.11.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "structlog==24.1.0",
    "tenacity==8.2.3",
    "email-validator==2.1.0.post1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.13.1",
    "mypy==1.10.0",
    "pylint==3.0.3",
    "ruff==0.4.4",
    "pre-commit==3.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
]
per-file-ignores = {
    "tests/*" = ["S101", "S106"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0114",
    "C0115",
    "C0116",
    "R0903",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]